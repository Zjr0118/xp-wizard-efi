name: Build XP Wizard EFI
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xorriso mtools dosfstools ovmf qemu-system-x86 python3-pil
      - name: Build gnu-efi from source (baseline x86-64)
        run: |
          git clone --depth 1 https://github.com/vathpela/gnu-efi.git /tmp/gnu-efi
          cd /tmp/gnu-efi
          make -j4 ARCH=x86_64 CFLAGS="-march=x86-64 -mtune=generic -mno-sse3 -mno-sse4.1 -mno-sse4.2 -mno-avx -O2 -fno-stack-protector" >/tmp/gnuefi.log 2>&1
          ls /tmp/gnu-efi/x86_64
      - name: 编译 + 打包
        run: |
          chmod +x tools/build.sh
          bash tools/build.sh

      - name: QEMU 引导自测
        run: |
          rm -rf build/shots
          python3 tools/qtest.py || true
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          for p in sorted(glob.glob("build/shots/*.ppm")):
              Image.open(p).save(p.replace(".ppm", ".png"))
          print("png:", len(glob.glob("build/shots/*.png")))
          PY
          echo "== 帧目录 ==" | tee build/xp-serial.txt
          mdir -i build/efiboot.img ::/frames 2>&1 | tee -a build/xp-serial.txt
          echo "== 串口关键行 ==" | tee -a build/xp-serial.txt
          tr -cd '\11\12\15\40-\176' < build/serial.log \
            | grep -a -i 'XPWIZARD\|gop status\|frames bytes\|present idx\|mode=\|res \|pixelformat\|handoff\|chainload\|LoadImage\|StartImage\|STAGE2' \
            | head -200 | tee -a build/xp-serial.txt || true

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xp-wizard
          path: |
            build/XP-Wizard.iso
            build/efiboot.img
            build/iso/EFI/BOOT/APPLE.EFI
            build/xp-serial.txt
            build/shots/*.png
            build/iso/EFI/BOOT/BOOTX64.EFI
            build/main.so
            build/qmon.log
            build/serial.log
            build/qemu-debug.log
          if-no-files-found: warn
